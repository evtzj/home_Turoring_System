<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 家教平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 400px;
        }
        h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 24px; }
        .subtitle { text-align: center; color: #999; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; color: #555; margin-bottom: 6px; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .error { color: #e74c3c; font-size: 13px; margin-bottom: 15px; display: none; }
        .switch-link { text-align: center; margin-top: 20px; font-size: 14px; color: #999; }
        .switch-link a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>家教平台</h1>
        <p class="subtitle">创建你的账号</p>

        <div class="error" id="error"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="给自己起个名字" required>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="phone" placeholder="11位手机号" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="至少6位密码" required>
            </div>
            <div class="form-group">
                <label>验证码</label>
                <input type="text" id="code" placeholder="6位验证码（测试用123456）" required>
            </div>
            <div class="form-group">
                <label>身份</label>
                <select id="role" required>
                    <option value="student">学生</option>
                    <option value="teacher">教师</option>
                </select>
            </div>
            <button type="submit">注 册</button>
        </form>

        <p class="switch-link">
            已有账号？<a href="/login/">去登录</a>
        </p>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const code = document.getElementById('code').value;
            const role = document.getElementById('role').value;
            const errorEl = document.getElementById('error');

            try {
                const res = await fetch('/api/user/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, phone, password, code, role })
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/login/';
                } else {
                    const msg = data.errors
                        ? Object.values(data.errors).flat().join('；')
                        : data.message;
                    errorEl.textContent = msg;
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = '网络错误，请稍后重试';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
