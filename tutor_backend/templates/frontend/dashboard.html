<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor · 控制台</title>
    <style>
        :root {
            --bg: #000;
            --surface: #1c1c1e;
            --surface2: #2c2c2e;
            --text: #f5f5f7;
            --text2: #98989d;
            --accent: #0071e3;
            --accent2: #af52de;
            --accent3: #ff9f0a;
            --red: #ff453a;
            --green: #30d158;
            --border: rgba(255,255,255,0.06);
            --radius: 16px;
            --transition: 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        /* ====== 侧边栏 ====== */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: rgba(28,28,30,0.5);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 50;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .sidebar-logo {
            font-size: 20px;
            font-weight: 650;
            letter-spacing: -0.5px;
            padding: 0 12px 28px;
        }
        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
        .sidebar-nav button {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 11px 12px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text2);
            font-size: 14px;
            font-weight: 450;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            text-align: left;
        }
        .sidebar-nav button:hover { background: rgba(255,255,255,0.04); color: var(--text); }
        .sidebar-nav button.active { background: rgba(255,255,255,0.08); color: #fff; font-weight: 550; }
        .sidebar-nav .icon { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-nav .badge {
            margin-left: auto;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: var(--accent);
            color: #fff;
        }
        .sidebar-footer {
            padding: 16px 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }
        .sidebar-user { font-size: 13px; color: var(--text); font-weight: 500; }
        .sidebar-role { font-size: 11px; color: var(--text2); margin-top: 2px; }
        .sidebar-logout {
            margin-top: 10px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.05);
            border: none;
            border-radius: 8px;
            color: var(--text2);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all var(--transition);
        }
        .sidebar-logout:hover { background: rgba(255,69,58,0.15); color: var(--red); }

        /* ====== 主区域 ====== */
        .main {
            flex: 1;
            margin-left: 240px;
            padding: 48px 48px 100px;
            max-width: calc(100% - 240px);
        }
        .main h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1.2px;
            margin-bottom: 6px;
        }
        .main .subtitle { font-size: 16px; color: var(--text2); letter-spacing: -0.3px; margin-bottom: 36px; }

        /* ====== 卡片/列表 ====== */
        .list { display: flex; flex-direction: column; gap: 10px; }
        .list-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition);
        }
        .list-item:hover { border-color: rgba(255,255,255,0.14); }
        .list-left h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .list-left .meta { font-size: 13px; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; }
        .list-right { display: flex; gap: 8px; align-items: center; }

        .pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 550;
            white-space: nowrap;
        }
        .pill.blue { background: rgba(0,113,227,0.15); color: #5ea8f5; }
        .pill.purple { background: rgba(175,82,222,0.15); color: #c081f0; }
        .pill.orange { background: rgba(255,159,10,0.15); color: #f5b840; }
        .pill.green { background: rgba(48,209,88,0.15); color: #5eda78; }
        .pill.gray { background: rgba(255,255,255,0.06); color: var(--text2); }
        .pill.red { background: rgba(255,69,58,0.15); color: #ff6961; }

        /* ====== 按钮 ====== */
        .btn {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 550;
            cursor: pointer;
            transition: all var(--transition);
            border: none;
            font-family: inherit;
            letter-spacing: -0.1px;
        }
        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { background: #e5e5e5; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text); }
        .btn-outline:hover { border-color: rgba(255,255,255,0.4); }
        .btn-danger { background: rgba(255,69,58,0.15); color: var(--red); }
        .btn-danger:hover { background: rgba(255,69,58,0.25); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ====== 弹窗 ====== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 440px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { font-size: 21px; font-weight: 650; margin-bottom: 20px; }
        .modal .field { margin-bottom: 16px; }
        .modal .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .modal .field input, .modal .field textarea, .modal .field select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: vertical;
        }
        .modal .field textarea { min-height: 80px; }
        .modal .field input:focus, .modal .field textarea:focus { border-color: var(--accent); }
        .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        /* ====== 聊天 ====== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 400px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-msg {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            letter-spacing: -0.2px;
        }
        .chat-msg.mine {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.theirs {
            align-self: flex-start;
            background: var(--surface2);
            border-bottom-left-radius: 4px;
        }
        .chat-msg .time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }
        .chat-input-area input:focus { border-color: var(--accent); }
        .chat-input-area button {
            padding: 12px 20px;
            border-radius: 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }
        .match-selector {
            display: flex;
            gap: 8px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }
        .match-selector button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            font-family: inherit;
        }
        .match-selector button.active { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.2); }

        /* ====== 统计卡片 ====== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: all var(--transition);
        }
        .stat-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.14); }
        .stat-card .icon { font-size: 20px; margin-bottom: 12px; }
        .stat-card .value { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
        .stat-card .label { font-size: 13px; color: var(--text2); margin-top: 4px; }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text2); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
        .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }

        .loading { text-align: center; padding: 60px; color: var(--text2); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            background: var(--surface2);
            color: #fff;
            font-size: 14px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 900px) {
            .sidebar { width: 72px; padding: 16px 8px; }
            .sidebar-nav button span:not(.icon) { display: none; }
            .sidebar-nav .badge { display: none; }
            .sidebar-logo { font-size: 16px; padding: 0 4px 20px; text-align: center; }
            .sidebar-footer { text-align: center; }
            .sidebar-user, .sidebar-role { display: none; }
            .main { margin-left: 72px; max-width: calc(100% - 72px); padding: 32px 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-logo">Tutor</div>
        <nav class="sidebar-nav" id="sidebarNav"></nav>
        <div class="sidebar-footer">
            <div class="sidebar-user" id="sidebarUser"></div>
            <div class="sidebar-role" id="sidebarRole"></div>
            <button class="sidebar-logout" onclick="logout()">退出登录</button>
        </div>
    </aside>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- 主内容 -->
    <main class="main" id="mainContent">
        <div class="loading">加载中…</div>
    </main>

    <script>
        // ====== 基础数据 ======
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (!token) { window.location.href = '/login/'; }

        const roleLabels = { teacher: '教师', student: '学生', admin: '管理员' };
        const statusPills = { pending:'orange', confirmed:'blue', accepted:'blue', in_progress:'purple', completed:'green', cancelled:'gray', declined:'red' };
        const statusLabels = { pending:'待处理', confirmed:'已接单', accepted:'已接受', in_progress:'进行中', completed:'已完成', cancelled:'已取消', declined:'已拒绝' };

        document.getElementById('sidebarUser').textContent = user.username;
        document.getElementById('sidebarRole').textContent = roleLabels[user.role] || user.role;

        function logout() { localStorage.clear(); window.location.href = '/login/'; }

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        async function apiFetch(url, method = 'GET', body = null) {
            const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Token ' + token } };
            if (body) opts.body = JSON.stringify(body);
            const res = await fetch(url, opts);
            return res.json();
        }

        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('show');
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ====== 导航配置 ======
        const navConfig = {
            student: [
                { id: 'teachers', icon: '👨‍🏫', label: '发现教师' },
                { id: 'matches', icon: '🤝', label: '我的匹配' },
                { id: 'orders', icon: '📋', label: '我的订单' },
                { id: 'chat', icon: '💬', label: '聊天' },
            ],
            teacher: [
                { id: 'matches', icon: '🤝', label: '匹配请求' },
                { id: 'orders', icon: '📋', label: '我的订单' },
                { id: 'chat', icon: '💬', label: '聊天' },
            ],
            admin: [
                { id: 'stats', icon: '📊', label: '平台概览' },
                { id: 'users', icon: '👥', label: '用户管理' },
            ]
        };

        const nav = navConfig[user.role] || [];
        const sidebarNav = document.getElementById('sidebarNav');
        nav.forEach(item => {
            const btn = document.createElement('button');
            btn.innerHTML = `<span class="icon">${item.icon}</span><span>${item.label}</span>`;
            btn.dataset.tab = item.id;
            btn.addEventListener('click', () => switchTab(item.id));
            sidebarNav.appendChild(btn);
        });

        let currentTab = null;

        async function switchTab(tabId) {
            currentTab = tabId;
            sidebarNav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            sidebarNav.querySelector(`[data-tab="${tabId}"]`)?.classList.add('active');
            await renderTab(tabId);
        }

        // ====== 渲染 ======
        async function renderTab(tabId) {
            const main = document.getElementById('mainContent');
            main.innerHTML = '<div class="loading">加载中…</div>';

            if (user.role === 'student') {
                if (tabId === 'teachers') await renderTeachers(main);
                else if (tabId === 'matches') await renderStudentMatches(main);
                else if (tabId === 'orders') await renderStudentOrders(main);
                else if (tabId === 'chat') await renderChat(main);
            } else if (user.role === 'teacher') {
                if (tabId === 'matches') await renderTeacherMatches(main);
                else if (tabId === 'orders') await renderTeacherOrders(main);
                else if (tabId === 'chat') await renderChat(main);
            } else if (user.role === 'admin') {
                if (tabId === 'stats') await renderAdminStats(main);
                else if (tabId === 'users') await renderAdminUsers(main);
            }
        }

        // ==================== 学生：发现教师 ====================
        async function renderTeachers(main) {
            const data = await apiFetch('/api/info/teachers/');
            if (!data.data || data.data.length === 0) {
                main.innerHTML = `<h1>发现教师</h1><p class="subtitle">找到最适合你的导师。</p><div class="empty-state"><div class="icon">📚</div><h3>暂无教师</h3></div>`;
                return;
            }
            let html = `<h1>发现教师</h1><p class="subtitle">共 ${data.data.length} 位教师，找到最适合你的导师。</p><div class="list">`;
            data.data.forEach(t => {
                html += `
                <div class="list-item">
                    <div class="list-left">
                        <h3>${t.username}</h3>
                        <div class="meta"><span>${t.subject}</span><span>·</span><span>${t.teaching_years} 年教龄</span><span>·</span><span>${t.education || '学历未填'}</span></div>
                    </div>
                    <div class="list-right">
                        <span class="pill blue">${t.subject}</span>
                        <button class="btn btn-primary" onclick="openMatchModal(${t.id}, '${t.username}', '${t.subject}')">发起匹配</button>
                    </div>
                </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
        }

        function openMatchModal(teacherId, teacherName, subject) {
            openModal(`
                <h3>发起匹配</h3>
                <p style="color:var(--text2);margin-bottom:16px;font-size:14px;">向 <strong style="color:#fff;">${teacherName}</strong> 发起教学请求</p>
                <div class="field"><label>想学的科目</label><input type="text" id="matchSubject" value="${subject}"></div>
                <div class="field"><label>留言介绍</label><textarea id="matchMessage" placeholder="介绍一下你自己，说说你想学什么…"></textarea></div>
                <div class="actions">
                    <button class="btn btn-outline" onclick="closeModal()">取消</button>
                    <button class="btn btn-primary" onclick="submitMatch(${teacherId})">发送请求</button>
                </div>
            `);
        }

        async function submitMatch(teacherId) {
            const subject = document.getElementById('matchSubject').value;
            const message = document.getElementById('matchMessage').value;
            const data = await apiFetch('/api/match/matches/', 'POST', {
                teacher: teacherId, subject, message
            });
            if (data.message && !data.errors) {
                closeModal();
                toast('匹配请求已发送');
            } else {
                toast(data.message || '发送失败');
            }
        }

        // ==================== 学生：我的匹配 ====================
        async function renderStudentMatches(main) {
            const data = await apiFetch('/api/match/matches/');
            if (!data.data || data.data.length === 0) {
                main.innerHTML = `<h1>我的匹配</h1><p class="subtitle">跟踪你发出的教学请求。</p><div class="empty-state"><div class="icon">🤝</div><h3>暂无匹配</h3></div>`;
                return;
            }
            let html = `<h1>我的匹配</h1><p class="subtitle">共 ${data.data.length} 个匹配请求。</p><div class="list">`;
            data.data.forEach(m => {
                html += `
                <div class="list-item">
                    <div class="list-left">
                        <h3>${m.subject} · 教师：${m.teacher_username}</h3>
                        <div class="meta"><span>发起时间：${new Date(m.created_at).toLocaleDateString('zh-CN')}</span></div>
                    </div>
                    <div class="list-right">
                        <span class="pill ${statusPills[m.status] || 'gray'}">${statusLabels[m.status] || m.status}</span>
                    </div>
                </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
        }

        // ==================== 学生：我的订单 ====================
        async function renderStudentOrders(main) {
            const data = await apiFetch('/api/order/orders/');
            if (!data.data || data.data.length === 0) {
                main.innerHTML = `<h1>我的订单</h1><p class="subtitle">管理你的课程订单。</p><div class="empty-state"><div class="icon">📋</div><h3>暂无订单</h3></div>`;
                return;
            }
            let html = `<h1>我的订单</h1><p class="subtitle">共 ${data.data.length} 个订单。</p><div class="list">`;
            data.data.forEach(o => {
                html += `
                <div class="list-item">
                    <div class="list-left">
                        <h3>${o.subject} · ¥${o.price}</h3>
                        <div class="meta"><span>教师：${o.teacher_username}</span><span>·</span><span>${o.scheduled_time || '时间待定'}</span><span>·</span><span>${o.address || '地址未填'}</span></div>
                    </div>
                    <div class="list-right">
                        <span class="pill ${statusPills[o.status] || 'gray'}">${statusLabels[o.status] || o.status}</span>
                    </div>
                </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
        }

        // ==================== 教师：匹配请求 ====================
        async function renderTeacherMatches(main) {
            const data = await apiFetch('/api/match/matches/');
            let html = `<h1>匹配请求</h1><p class="subtitle">学生发来的教学请求。</p>`;
            if (!data.data || data.data.length === 0) {
                html += '<div class="empty-state"><div class="icon">🤝</div><h3>暂无请求</h3></div>';
                main.innerHTML = html; return;
            }
            html += `<div class="list">`;
            data.data.forEach(m => {
                html += `
                <div class="list-item">
                    <div class="list-left">
                        <h3>${m.subject} · 学生：${m.student_username}</h3>
                        <div class="meta"><span>${new Date(m.created_at).toLocaleDateString('zh-CN')}</span></div>
                    </div>
                    <div class="list-right">
                        <span class="pill ${statusPills[m.status] || 'gray'}">${statusLabels[m.status] || m.status}</span>
                        ${m.status === 'pending' ? `
                            <button class="btn btn-primary" onclick="handleMatch(${m.id}, 'accepted')">接受</button>
                            <button class="btn btn-danger" onclick="handleMatch(${m.id}, 'declined')">拒绝</button>
                        ` : ''}
                    </div>
                </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
        }

        async function handleMatch(matchId, status) {
            const data = await apiFetch(`/api/match/matches/${matchId}/confirm/`, 'PUT', { status });
            if (data.message && !data.errors) {
                toast(status === 'accepted' ? '已接受匹配' : '已拒绝匹配');
                await switchTab('matches');
            } else {
                toast(data.message || '操作失败');
            }
        }

        // ==================== 教师：我的订单 ====================
        async function renderTeacherOrders(main) {
            const data = await apiFetch('/api/order/orders/');
            let html = `<h1>我的订单</h1><p class="subtitle">学生发来的课程订单。</p>`;
            if (!data.data || data.data.length === 0) {
                html += '<div class="empty-state"><div class="icon">📋</div><h3>暂无订单</h3></div>';
                main.innerHTML = html; return;
            }
            html += `<div class="list">`;
            data.data.forEach(o => {
                const canConfirm = o.status === 'pending';
                const canComplete = o.status === 'confirmed';
                html += `
                <div class="list-item">
                    <div class="list-left">
                        <h3>${o.subject} · ¥${o.price}</h3>
                        <div class="meta"><span>学生：${o.student_username}</span><span>·</span><span>${o.scheduled_time || '时间待定'}</span><span>·</span><span>${o.address || '地址未填'}</span></div>
                    </div>
                    <div class="list-right">
                        <span class="pill ${statusPills[o.status] || 'gray'}">${statusLabels[o.status] || o.status}</span>
                        ${canConfirm ? `<button class="btn btn-primary" onclick="updateOrderStatus(${o.id}, 'confirmed')">接单</button>` : ''}
                        ${canComplete ? `<button class="btn btn-primary" onclick="updateOrderStatus(${o.id}, 'completed')">完成</button>` : ''}
                    </div>
                </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
        }

        async function updateOrderStatus(orderId, status) {
            const data = await apiFetch(`/api/order/orders/${orderId}/`, 'PUT', { status });
            if (data.message && !data.errors) {
                toast('订单状态已更新');
                await switchTab('orders');
            } else {
                toast(data.message || '操作失败');
            }
        }

        // ==================== 聊天 ====================
        let chatMatchId = null;
        let chatInterval = null;

        async function renderChat(main) {
            // 先拿匹配列表，找到已接受的匹配
            const matchData = await apiFetch('/api/match/matches/');
            const activeMatches = (matchData.data || []).filter(m => m.status === 'accepted' || m.status === 'confirmed');

            let html = `<h1>聊天</h1><p class="subtitle">与你的教学伙伴实时沟通。</p>`;
            if (activeMatches.length === 0) {
                html += '<div class="empty-state"><div class="icon">💬</div><h3>暂无可聊天的匹配</h3><p style="font-size:13px;">匹配通过后才能开始聊天。</p></div>';
                main.innerHTML = html;
                return;
            }

            html += `
            <div class="chat-container">
                <div class="match-selector" id="matchSelector">
                    ${activeMatches.map(m => {
                        const otherName = user.role === 'student' ? m.teacher_username : m.student_username;
                        return `<button data-match="${m.id}" onclick="selectChat(${m.id})">${otherName} · ${m.subject}</button>`;
                    }).join('')}
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="empty-state" style="padding:40px;"><p>选择一个对话开始聊天</p></div>
                </div>
                <div class="chat-input-area" id="chatInputArea" style="display:none;">
                    <input type="text" id="chatInput" placeholder="输入消息…" onkeydown="if(event.key==='Enter')sendMessage()">
                    <button onclick="sendMessage()">发送</button>
                </div>
            </div>`;
            main.innerHTML = html;
        }

        async function selectChat(matchId) {
            chatMatchId = matchId;
            if (chatInterval) clearInterval(chatInterval);

            document.querySelectorAll('#matchSelector button').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-match="${matchId}"]`)?.classList.add('active');
            document.getElementById('chatInputArea').style.display = 'flex';

            await loadMessages();
            chatInterval = setInterval(loadMessages, 3000);
        }

        async function loadMessages() {
            if (!chatMatchId) return;
            const data = await apiFetch(`/api/chat/matches/${chatMatchId}/messages/`);
            const container = document.getElementById('chatMessages');
            if (!data.data || data.data.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding:40px;"><p style="font-size:13px;">还没有消息，开始聊天吧。</p></div>';
            } else {
                container.innerHTML = data.data.map(msg => `
                    <div class="chat-msg ${msg.sender === user.id ? 'mine' : 'theirs'}">
                        <div>${msg.content}</div>
                        <div class="time">${new Date(msg.created_at).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const content = input.value.trim();
            if (!content || !chatMatchId) return;
            input.value = '';
            await apiFetch(`/api/chat/matches/${chatMatchId}/messages/`, 'POST', { content });
            await loadMessages();
        }

        // ==================== 管理员：平台概览 ====================
        async function renderAdminStats(main) {
            const data = await apiFetch('/api/admin/stats/');
            const d = data.data;
            main.innerHTML = `
                <h1>平台概览</h1>
                <p class="subtitle">实时数据，一目了然。</p>
                <div class="stats-grid">
                    <div class="stat-card"><div class="icon">👥</div><div class="value">${d.total_users}</div><div class="label">总用户</div></div>
                    <div class="stat-card"><div class="icon">🎓</div><div class="value">${d.total_students}</div><div class="label">学生</div></div>
                    <div class="stat-card"><div class="icon">👨‍🏫</div><div class="value">${d.total_teachers}</div><div class="label">教师</div></div>
                    <div class="stat-card"><div class="icon">🤝</div><div class="value">${d.total_matches}</div><div class="label">匹配数</div></div>
                </div>`;
        }

        // ==================== 管理员：用户管理 ====================
        async function renderAdminUsers(main) {
            const data = await apiFetch('/api/admin/users/');
            let html = `<h1>用户管理</h1><p class="subtitle">管理平台所有用户。</p>`;
            if (!data.data || data.data.length === 0) {
                html += '<div class="empty-state"><div class="icon">👥</div><h3>暂无用户</h3></div>';
                main.innerHTML = html; return;
            }
            html += `<div class="list">`;
            data.data.forEach(u => {
                const isUnverifiedTeacher = u.role === 'teacher' && !u.is_verified;
                html += `
                <div class="list-item">
                    <div class="list-left">
                        <h3>${u.username} <span style="font-size:12px;color:var(--text2);">@${u.phone}</span></h3>
                        <div class="meta"><span class="pill ${u.role==='teacher'?'purple':u.role==='admin'?'orange':'blue'}">${roleLabels[u.role]}</span><span>${u.is_verified ? '✅ 已认证' : '⏳ 未认证'}</span></div>
                    </div>
                    <div class="list-right">
                        ${isUnverifiedTeacher ? `<button class="btn btn-primary" onclick="verifyTeacher(${u.id})">审核通过</button>` : ''}
                    </div>
                </div>`;
            });
            html += '</div>';
            main.innerHTML = html;
        }

        async function verifyTeacher(userId) {
            const data = await apiFetch(`/api/admin/teachers/${userId}/check/`, 'PUT');
            if (data.message && !data.errors) {
                toast('教师审核通过');
                await switchTab('users');
            } else {
                toast(data.message || '操作失败');
            }
        }

        // ====== 初始加载 ======
        switchTab(nav[0].id);
    </script>
</body>
</html>
