services:
  web:
    build: .
    container_name: tutor-web
    volumes:
      - db_data:/ap/tutor_backend
    restart: always


  nginx:
    image: nginx:alpine
    container_name: tutor-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always

volumes:
  db_data: